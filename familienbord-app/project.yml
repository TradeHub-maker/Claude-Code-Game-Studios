# XcodeGen-Spezifikation. Auf dem Mac: `brew install xcodegen && xcodegen generate`, dann Familienbord.xcodeproj öffnen.
name: Familienbord
options:
  bundleIdPrefix: de.example   # ANPASSEN auf deinen Prefix (auch in Shared/SharedStore.swift)
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""       # deine Apple Team-ID eintragen
targets:
  Familienbord:
    type: application
    platform: iOS
    sources: [Familienbord, Shared]
    entitlements:
      path: Familienbord/Familienbord.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.de.example.familienbord]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.de.example.familienbord]
        aps-environment: development
    info:
      path: Familienbord/Info.plist
      properties:
        CFBundleDisplayName: Familienbord
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSUserActivityTypes: []
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: de.example.familienbord }
    dependencies:
      - target: FamilienbordWidget
  FamilienbordWidget:
    type: app-extension
    platform: iOS
    sources: [FamilienbordWidget, Shared]
    entitlements:
      path: FamilienbordWidget/FamilienbordWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.de.example.familienbord]
    info:
      path: FamilienbordWidget/Info.plist
      properties:
        CFBundleDisplayName: Familienbord Widget
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: de.example.familienbord.widget }
